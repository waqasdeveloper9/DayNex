<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><style>text{font:20px Arial,sans-serif;fill:#27364a}.label{fill:white;font-weight:bold}.small{font-size:17px}</style><rect width="1100" height="620" rx="12" fill="#f7f9fc"/><rect width="1100" height="60" fill="#24354b"/><text x="24" y="38" class="label">POSTMAN — token form illustration (not a screenshot)</text><text x="45" y="105">Authorization → OAuth 2.0</text><text x="45" y="160" font-weight="bold">Configure New Token</text><text x="45" y="208">Token Name</text><rect x="45" y="220" width="610" height="42" fill="white" stroke="#b9c7d8"/><text x="60" y="248">DayNex Google Login</text><text x="45" y="298">Grant Type</text><rect x="45" y="312" width="610" height="45" fill="white" stroke="#ff6c37" stroke-width="4"/><text x="60" y="342">Authorization Code (With PKCE)  ▾</text><circle cx="700" cy="334" r="18" fill="#e35421"/><text x="694" y="341" class="label">4</text><text x="735" y="341">Choose this grant</text><rect x="45" y="385" width="25" height="25" fill="#ff6c37"/><text x="49" y="405" class="label">✓</text><text x="86" y="405">Authorize using browser</text><circle cx="700" cy="397" r="18" fill="#e35421"/><text x="694" y="404" class="label">5</text><text x="735" y="404">Enable this checkbox</text><text x="45" y="454">Callback URL</text><rect x="45" y="468" width="610" height="47" fill="white" stroke="#ff6c37" stroke-width="4"/><text x="60" y="499" class="small">https://oauth.pstmn.io/v1/browser-callback</text><circle cx="700" cy="491" r="18" fill="#e35421"/><text x="694" y="498" class="label">6</text><text x="735" y="498">Copy your displayed URL</text><text x="45" y="563" class="small">Scroll within the Authorization panel if Configure New Token is below the visible area.</text><text x="45" y="591" class="small">The address shown here is an example. Register the exact address displayed in your Postman.</text></svg>
