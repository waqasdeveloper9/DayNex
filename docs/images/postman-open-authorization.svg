<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510"><style>text{font-family:Arial,sans-serif;fill:#27364a;font-size:20px}.label{fill:#fff;font-weight:bold}.small{font-size:16px}</style><rect width="1100" height="510" rx="12" fill="#f7f9fc"/><rect width="1100" height="60" fill="#24354b"/><text x="24" y="38" class="label">POSTMAN — navigation illustration (not a screenshot)</text><rect x="15" y="80" width="200" height="410" fill="#e7edf5"/><text x="35" y="120">Workspace</text><text x="35" y="170">Collections</text><text x="35" y="210">Environments</text><rect x="235" y="82" width="75" height="43" rx="7" fill="#fff" stroke="#ff6c37" stroke-width="4"/><text x="265" y="112">+</text><circle cx="345" cy="101" r="17" fill="#e35421"/><text x="340" y="108" class="label">1</text><text x="380" y="108">Open a new request tab</text><rect x="235" y="150" width="800" height="55" fill="white" stroke="#c4cfdd"/><text x="250" y="185">GET</text><text x="340" y="185">https://localhost:7250/api/identity/me</text><text x="247" y="250">Params</text><rect x="340" y="220" width="160" height="48" rx="6" fill="#fff0e8" stroke="#ff6c37" stroke-width="4"/><text x="355" y="250">Authorization</text><text x="535" y="250">Headers</text><text x="660" y="250">Body</text><circle cx="420" cy="310" r="18" fill="#e35421"/><text x="414" y="317" class="label">2</text><text x="455" y="317">Click Authorization below the URL bar</text><text x="250" y="378">Auth Type</text><rect x="250" y="395" width="285" height="47" fill="white" stroke="#ff6c37" stroke-width="4"/><text x="268" y="425">OAuth 2.0  ▾</text><circle cx="578" cy="416" r="18" fill="#e35421"/><text x="572" y="423" class="label">3</text><text x="615" y="423">Select OAuth 2.0</text><text x="250" y="481" class="small">Some versions use “Type” instead of “Auth Type”. Choose the same OAuth 2.0 option.</text></svg>
